plugins { id 'com.android.application' }
def releaseVersion = new Properties()
rootProject.file('version.properties').withInputStream { releaseVersion.load(it) }

android {
    namespace 'il.co.kiosk'
    compileSdk 35
    defaultConfig {
        applicationId 'il.co.kiosk'
        minSdk 28
        targetSdk 35
        versionCode releaseVersion.getProperty('versionCode').toInteger()
        versionName releaseVersion.getProperty('versionName')
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
